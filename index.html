<!DOCTYPE html>
<html lang="nb">
<head>
    <title>Klepp</title>

    <style>
        body {
            margin: 0;
            padding: 0;

            background-color: black;
            color: white;
            font-family: Calibri, Arial, sans-serif;
            overflow: hidden;
        }

        .wrapper {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            position: relative;

            width: 1280px;
            height: 720px;
            max-width: 100%;

            background-color: black;
            overflow: hidden;
        }

        .video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            background-color: black;

            visibility: hidden;
        }

        .video.active {
            visibility: visible;
        }

        .clip-info {
            position: absolute;
            left: 14px;
            bottom: 14px;

            width: min(440px, calc(100% - 28px));
            box-sizing: border-box;
            padding: 9px 11px;

            z-index: 50;

            background: #050505;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 4px;

            text-align: left;
        }

        .clip-title-wrapper {
            width: 100%;
            min-width: 0;

            overflow: hidden;
            white-space: nowrap;
        }

        .clip-title {
            display: inline-block;

            font-size: 17px;
            line-height: 1.2;
            font-weight: 800;

            color: rgba(255, 255, 255, 0.95);

            white-space: nowrap;
            transform: translateX(0);
        }

        .clip-title.scrolling {
            animation-name: scroll-title;
            animation-duration: var(--scroll-duration);
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes scroll-title {
            0%,
            18% {
                transform: translateX(0);
            }

            82%,
            100% {
                transform: translateX(var(--scroll-distance));
            }
        }

        .clip-details {
            margin-top: 5px;

            font-size: 12px;
            line-height: 1.2;

            color: rgba(255, 255, 255, 0.74);

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .clip-secondary {
            font-size: 12px;
            color: rgb(201 201 201 / 0.74);
        }

        .separator {
            padding: 0 4px;
            color: rgba(255, 255, 255, 0.35);
        }

        .audio-overlay {
            display: none;

            position: absolute;
            inset: 0;
            z-index: 100;

            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.45);

            font-size: 42px;
            font-weight: bold;

            cursor: pointer;
            user-select: none;
        }

        .audio-overlay.visible {
            display: flex;
        }

        .audio-overlay span {
            padding: 20px 32px;

            border-radius: 12px;
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

<body>

<div class="wrapper">
    <div class="video-container">
        <video
            class="video active"
            id="video-0"
            playsinline
            preload="auto">
        </video>

        <video
            class="video"
            id="video-1"
            playsinline
            preload="auto">
        </video>

        <div class="clip-info">
            <div class="clip-title-wrapper" id="clip-title-wrapper">
                <div class="clip-title" id="clip-title"></div>
            </div>

            <div class="clip-details">
                <span>Klippet av <span id="clip-creator"></span></span>
                <span class="separator">•</span>
                <span id="clip-date"></span>

                <span class="clip-secondary">
                    <span class="separator">•</span>
                    <span id="clip-number"></span>
                    <span class="separator">•</span>
                    <span id="clip-tags"></span>
                </span>
            </div>
        </div>

        <div class="audio-overlay" id="audio-overlay">
            <span>Klikk for lyd 🔊</span>
        </div>
    </div>
</div>

<script type="application/javascript">
    function shuffle(array) {
        let currentIndex = array.length;

        while (currentIndex !== 0) {
            const randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;

            [array[currentIndex], array[randomIndex]] = [
                array[randomIndex],
                array[currentIndex]
            ];
        }
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const formatter = new Intl.DateTimeFormat("no-NO", {
            timeZone: "Europe/Oslo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
        });

        const clipTitle = document.getElementById("clip-title");
        const clipTitleWrapper = document.getElementById("clip-title-wrapper");
        const clipCreator = document.getElementById("clip-creator");
        const clipDate = document.getElementById("clip-date");
        const clipNumber = document.getElementById("clip-number");
        const clipTags = document.getElementById("clip-tags");
        const audioOverlay = document.getElementById("audio-overlay");

        const videos = [
            document.getElementById("video-0"),
            document.getElementById("video-1"),
        ];

        const queryParams = new URLSearchParams(window.location.search);

        const spesial = queryParams.get("spesial");

        let start = queryParams.get("start");
        if (start == null) {
            start = "2023-01-01T00:00:00Z";
        }

        if (spesial === "Romania") {
            start = "2025-05-29T00:00:00Z";
        }

        let end = queryParams.get("end");
        if (end == null) {
            end = "2026-12-31T23:59:59Z";
        }

        if (spesial === "Romania") {
            end = "2025-07-08T02:00:00Z";
        }

        let viewCountLimit = queryParams.get("viewCountLimit");
        if (viewCountLimit == null) {
            viewCountLimit = 0;
        }

        const clipsUrl = `https://api.j4d.dev/streamrig/clip?start=${start}&end=${end}&viewCountLimit=${viewCountLimit}&ignoreTags=karaoke,teknisk,nattero`;

        const response = await fetch(clipsUrl);

        const clips = await response.json();

        if (clips.length === 0) {
            clipTitle.innerText = "Ingen klipp";
            return;
        }

        shuffle(clips);

        let clipIndex = 0;
        let activeVideoIndex = 0;
        let refreshingClips = false;
        let playbackAttempt = 0;
        let playbackTimeout = null;
        let nextClipTimeout = null;
        let consecutiveFailures = 0;
        let lastPlaybackTime = 0;

        function getDownloadUrlExpiry(downloadUrl) {
            try {
                const token = new URL(downloadUrl).searchParams.get("token");
                if (!token) {
                    return null;
                }

                const {expires} = JSON.parse(token);
                const expiresAt = new Date(expires * 1000);

                return typeof expires === "number" &&
                Number.isFinite(expiresAt.getTime())
                    ? expiresAt
                    : null;
            } catch {
                return null;
            }
        }

        function isDownloadUrlUsable(downloadUrl) {
            if (typeof downloadUrl !== "string" || !downloadUrl.trim()) return false;

            try {
                const url = new URL(downloadUrl);
                if (url.protocol !== "https:" && url.protocol !== "http:") return false;

                const expiresAt = getDownloadUrlExpiry(downloadUrl);
                return expiresAt === null || expiresAt.getTime() > Date.now();
            } catch {
                return false;
            }
        }

        function logDownloadUrlExpiries(label, batch) {
            const now = Date.now();
            const expiries = batch
                .map(clip => ({
                    id: clip.id,
                    expiresAt: getDownloadUrlExpiry(clip.downloadUrl),
                }))
                .filter(clip => clip.expiresAt !== null);

            const expired = expiries.filter(clip => clip.expiresAt.getTime() <= now);
            const upcoming = expiries
                .filter(clip => clip.expiresAt.getTime() > now)
                .sort((a, b) => a.expiresAt - b.expiresAt);

            console.info(
                `${label}: ${expired.length} av ${batch.length} klipp-URL-er har utløpt. ` +
                `${batch.length - expiries.length} har ukjent utløpstid.`
            );

            if (expired.length > 0) {
                console.warn(`${label}: Utløpte klipp-URL-er`, expired);
            }

            console.info(
                `${label}: Neste utløpstid (UTC):`,
                upcoming.length > 0 ? upcoming[0].expiresAt.toISOString() : "Ingen kjent",
                upcoming.length > 0 ? `Klipp: ${upcoming[0].id}` : ""
            );
        }

        async function refreshClips() {
            if (refreshingClips) {
                return;
            }

            refreshingClips = true;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 30000);

            try {
                const response = await fetch(clipsUrl, {
                    cache: "no-store",
                    signal: controller.signal,
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const refreshedClips = await response.json();
                if (!Array.isArray(refreshedClips) ||
                    refreshedClips.some(clip => !clip || typeof clip.id !== "string")) {
                    throw new Error("Uventet klipprespons");
                }

                logDownloadUrlExpiries("Før oppdatering", clips);

                const refreshedById = new Map(refreshedClips.map(clip => [clip.id, clip]));
                let updated = 0;

                for (const clip of clips) {
                    const refreshed = refreshedById.get(clip.id);
                    if (refreshed) {
                        Object.assign(clip, refreshed);
                        clip.downloadUrl = refreshed.downloadUrl ?? null;
                        updated++;
                    }
                }

                console.info(`Oppdaterte ${updated} av ${clips.length} klipp uten å endre rekkefølgen.`);
                logDownloadUrlExpiries("Ny batch", refreshedClips);
            } catch (error) {
                console.warn("Kunne ikke oppdatere klippdata", error);
            } finally {
                clearTimeout(timeout);
                refreshingClips = false;
            }
        }

        function showAudioOverlay() {
            audioOverlay.classList.add("visible");
        }

        function hideAudioOverlay() {
            audioOverlay.classList.remove("visible");
        }

        function updateTitleScrolling() {
            clipTitle.classList.remove("scrolling");
            clipTitle.style.removeProperty("--scroll-distance");
            clipTitle.style.removeProperty("--scroll-duration");

            requestAnimationFrame(() => {
                const overflow = clipTitle.scrollWidth - clipTitleWrapper.clientWidth;

                if (overflow <= 0) {
                    return;
                }

                const scrollDistance = -overflow;
                const duration = Math.max(8, overflow / 35 + 5);

                clipTitle.style.setProperty("--scroll-distance", `${scrollDistance}px`);
                clipTitle.style.setProperty("--scroll-duration", `${duration}s`);
                clipTitle.classList.add("scrolling");
            });
        }

        function updateMetadata(index) {
            const clip = clips[index];

            clipTitle.innerText = clip.title;
            clipCreator.innerText = clip.creatorName;

            const date = new Date(clip.createdAt);

            clipDate.innerText = formatter.format(date).replace(",", "");
            clipNumber.innerText = `${index + 1} / ${clips.length}`;
            clipTags.innerText = clip.tags?.length ? ` • ${clip.tags.join(", ")}` : "";

            updateTitleScrolling();
        }

        function prepareVideo(video, clip) {
            video.pause();
            if (!isDownloadUrlUsable(clip.downloadUrl)) {
                video.removeAttribute("src");
                video.load();
                return;
            }

            video.src = clip.downloadUrl;
            video.preload = "auto";
            video.load();
        }

        function preloadNextClip() {
            if (clips.length <= 1) {
                return;
            }

            const nextClipIndex = (clipIndex + 1) % clips.length;
            const nextVideoIndex = (activeVideoIndex + 1) % videos.length;

            prepareVideo(videos[nextVideoIndex], clips[nextClipIndex]);
        }

        async function playCurrentClip() {
            const video = videos[activeVideoIndex];
            const clip = clips[clipIndex];
            const attempt = ++playbackAttempt;
            lastPlaybackTime = 0;

            if (!isDownloadUrlUsable(clip.downloadUrl)) {
                scheduleNextClip("Manglende, ugyldig eller utløpt downloadUrl", null, attempt);
                return;
            }

            try {
                if (video.getAttribute("src") !== clip.downloadUrl || video.error) {
                    prepareVideo(video, clip);
                }

                updateMetadata(clipIndex);

                video.classList.add("active");
                video.currentTime = 0;
                video.volume = 1;
                video.muted = false;
                resetPlaybackTimeout(attempt);

                await video.play();
                if (!isCurrentPlayback(attempt)) return;

                hideAudioOverlay();
            } catch (error) {
                if (!isCurrentPlayback(attempt)) return;

                if (error.name === "NotAllowedError") {
                    console.log("Autoplay med lyd ble blokkert. Starter video muted.");

                    video.muted = true;

                    try {
                        await video.play();
                        if (!isCurrentPlayback(attempt)) return;
                        showAudioOverlay();
                    } catch (mutedError) {
                        if (!isCurrentPlayback(attempt)) return;
                        if (mutedError.name === "NotAllowedError") {
                            clearTimeout(playbackTimeout);
                            showAudioOverlay();
                        } else {
                            scheduleNextClip("Kunne ikke spille av klipp, heller ikke muted", mutedError, attempt);
                            return;
                        }
                    }
                } else {
                    scheduleNextClip("Kunne ikke spille av klipp", error, attempt);
                    return;
                }
            }

            if (isCurrentPlayback(attempt)) {
                preloadNextClip();
            }
        }

        function isCurrentPlayback(attempt) {
            return attempt === playbackAttempt && nextClipTimeout === null;
        }

        function resetPlaybackTimeout(attempt) {
            clearTimeout(playbackTimeout);
            playbackTimeout = setTimeout(() => {
                scheduleNextClip("Ingen fremdrift i avspillingen på 30 sekunder", null, attempt);
            }, 30000);
        }

        function scheduleNextClip(reason = null, error = null, attempt = playbackAttempt) {
            if (!isCurrentPlayback(attempt)) return;

            clearTimeout(playbackTimeout);
            let delay = 0;

            if (reason) {
                console.warn("Hopper over klipp", clips[clipIndex].id, reason, error);
                consecutiveFailures++;
                if (consecutiveFailures >= clips.length) {
                    delay = 60000;
                    console.warn("Alle klipp har feilet. Prøver igjen om ett minutt.");
                }
            } else {
                consecutiveFailures = 0;
            }

            // Sett sperren før pause(), slik at samme feil ikke utløser flere hopp.
            nextClipTimeout = setTimeout(() => {
                nextClipTimeout = null;
                if (delay > 0) consecutiveFailures = 0;
                playNextClip();
            }, delay);
            videos[activeVideoIndex].pause();
            hideAudioOverlay();
        }

        async function playNextClip() {
            const oldVideo = videos[activeVideoIndex];

            oldVideo.pause();
            oldVideo.classList.remove("active");

            clipIndex = (clipIndex + 1) % clips.length;
            activeVideoIndex = (activeVideoIndex + 1) % videos.length;

            await playCurrentClip();
        }

        audioOverlay.addEventListener("click", async () => {
            const video = videos[activeVideoIndex];
            const attempt = playbackAttempt;
            if (!isCurrentPlayback(attempt)) return;

            try {
                video.muted = false;
                video.volume = 1;
                resetPlaybackTimeout(attempt);

                await video.play();
                if (!isCurrentPlayback(attempt)) return;

                hideAudioOverlay();
                resetPlaybackTimeout(attempt);
            } catch (error) {
                if (!isCurrentPlayback(attempt)) return;
                console.error("Kunne ikke aktivere lyd", error);
                if (error.name === "NotAllowedError") {
                    clearTimeout(playbackTimeout);
                    showAudioOverlay();
                } else {
                    scheduleNextClip("Kunne ikke aktivere avspilling", error, attempt);
                }
            }
        });

        videos.forEach((video) => {
            video.addEventListener("ended", () => {
                if (video === videos[activeVideoIndex] && video.ended) {
                    scheduleNextClip();
                }
            });

            video.addEventListener("error", () => {
                if (video === videos[activeVideoIndex] && video.error) {
                    scheduleNextClip("Feil ved avspilling av klipp", video.error);
                }
            });

            video.addEventListener("timeupdate", () => {
                if (video === videos[activeVideoIndex] && isCurrentPlayback(playbackAttempt) && video.currentTime > lastPlaybackTime) {
                    lastPlaybackTime = video.currentTime;
                    resetPlaybackTimeout(playbackAttempt);
                }
            });
        });

        logDownloadUrlExpiries("Ved oppstart", clips);
        setInterval(refreshClips, 15 * 60 * 1000);

        await playCurrentClip();
    });
</script>

</body>
</html>
