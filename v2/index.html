<!DOCTYPE html>
<html lang="nb">
<head>
    <title>Klepp</title>

    <style>
        body {
            margin: 0;
            padding: 0;

            background-color: black;
            color: white;
        }

        .wrapper {
            width: 90%;
            height: 100vh;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .title {
            width: 60%;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            display: block;
            text-overflow: ellipsis;
        }

        .video-container {
            position: relative;
            width: 1280px;
            height: 720px;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
            background-color: black;
        }

        .video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            background-color: black;

            visibility: hidden;
        }

        .video.active {
            visibility: visible;
        }
    </style>
</head>

<body>

<div class="wrapper">
    <h1 class="title" id="title"></h1>

    <div class="video-container">
        <video
            class="video active"
            id="video-0"
            preload="auto"
            playsinline>
        </video>

        <video
            class="video"
            id="video-1"
            preload="auto"
            playsinline>
        </video>
    </div>

    <p id="description"></p>
</div>

<script type="application/javascript">
    function shuffle(array) {
        let currentIndex = array.length;

        while (currentIndex !== 0) {
            const randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;

            [array[currentIndex], array[randomIndex]] = [
                array[randomIndex],
                array[currentIndex]
            ];
        }
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const formatter = new Intl.DateTimeFormat("no-NO", {
            timeZone: "Europe/Oslo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
        });

        const title = document.getElementById("title");
        const description = document.getElementById("description");

        const videos = [
            document.getElementById("video-0"),
            document.getElementById("video-1"),
        ];

        const queryParams = new URLSearchParams(window.location.search);

        const spesial = queryParams.get("spesial");

        let start = queryParams.get("start");
        if (start == null) {
            start = "2023-01-01T00:00:00Z";
        }

        if (spesial === "Romania") {
            start = "2025-05-29T00:00:00Z";
        }

        let end = queryParams.get("end");
        if (end == null) {
            end = "2026-12-31T23:59:59Z";
        }

        if (spesial === "Romania") {
            end = "2025-07-08T02:00:00Z";
        }

        let viewCountLimit = queryParams.get("viewCountLimit");
        if (viewCountLimit == null) {
            viewCountLimit = 0;
        }

        const response = await fetch(
            `https://api.j4d.dev/streamrig/clip?start=${start}&end=${end}&viewCountLimit=${viewCountLimit}&ignoreTags=karaoke,teknisk,nattero`
        );

        const clips = await response.json();

        if (clips.length === 0) {
            title.innerText = "Ingen klipp";
            return;
        }

        shuffle(clips);

        let clipIndex = 0;
        let activeVideoIndex = 0;

        function updateMetadata(index) {
            const clip = clips[index];

            title.innerText = clip.title;

            const date = new Date(clip.createdAt);
            const tags = clip.tags ?? [];

            description.innerText =
                `Klippet av ${clip.creatorName}. ` +
                `Visninger: ${clip.viewCount}. ` +
                `Klippet: ${formatter.format(date).replace(",", "")}. ` +
                `(Klipp nr. ${index + 1} av ${clips.length}.) ` +
                `(${tags.join(",")})`;
        }

        function prepareVideo(video, clip) {
            video.pause();
            video.src = clip.downloadUrl;
            video.preload = "auto";
            video.load();
        }

        function preloadNextClip() {
            if (clips.length <= 1) {
                return;
            }

            const nextClipIndex = (clipIndex + 1) % clips.length;
            const nextVideoIndex = (activeVideoIndex + 1) % videos.length;

            prepareVideo(
                videos[nextVideoIndex],
                clips[nextClipIndex]
            );
        }

        async function playCurrentClip() {
            const video = videos[activeVideoIndex];

            updateMetadata(clipIndex);

            video.classList.add("active");
            video.muted = false;
            video.volume = 1;
            video.currentTime = 0;

            try {
                await video.play();
            } catch (error) {
                console.error("Kunne ikke spille av klipp", clips[clipIndex], error);
            }

            preloadNextClip();
        }

        async function playNextClip() {
            const oldVideo = videos[activeVideoIndex];

            oldVideo.pause();
            oldVideo.classList.remove("active");

            clipIndex = (clipIndex + 1) % clips.length;
            activeVideoIndex = (activeVideoIndex + 1) % videos.length;

            await playCurrentClip();
        }

        videos.forEach((video) => {
            video.addEventListener("ended", () => {
                if (video === videos[activeVideoIndex]) {
                    playNextClip();
                }
            });

            video.addEventListener("error", () => {
                if (video === videos[activeVideoIndex]) {
                    console.error(
                        "Feil ved avspilling av klipp",
                        clips[clipIndex],
                        video.error
                    );

                    playNextClip();
                }
            });
        });

        prepareVideo(videos[activeVideoIndex], clips[clipIndex]);
        await playCurrentClip();
    });
</script>

</body>
</html>
