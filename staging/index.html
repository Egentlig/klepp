<!DOCTYPE html>
<html lang="nb">
<head>
    <title>Klepp</title>

    <style>
        body {
            margin: 0;
            padding: 0;

            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .wrapper {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            position: relative;

            width: 1280px;
            height: 720px;
            max-width: 100%;

            background-color: black;
            overflow: hidden;
        }

        .video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            background-color: black;

            visibility: hidden;
        }

        .video.active {
            visibility: visible;
        }

        .clip-info {
            position: absolute;
            left: 14px;
            bottom: 14px;

            width: min(520px, calc(100% - 28px));
            box-sizing: border-box;
            padding: 9px 11px;

            z-index: 50;

            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 5px;

            text-align: left;
        }

        .clip-title-wrapper {
            width: 100%;
            min-width: 0;

            overflow: hidden;
            white-space: nowrap;
        }

        .clip-title {
            display: inline-block;

            font-size: 15px;
            line-height: 1.2;
            font-weight: 600;

            color: rgba(255, 255, 255, 0.88);

            white-space: nowrap;
            transform: translateX(0);
        }

        .clip-title.scrolling {
            animation-name: scroll-title;
            animation-duration: var(--scroll-duration);
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes scroll-title {
            0%,
            18% {
                transform: translateX(0);
            }

            82%,
            100% {
                transform: translateX(var(--scroll-distance));
            }
        }

        .clip-details {
            margin-top: 5px;

            font-size: 11px;
            line-height: 1.2;

            color: rgba(255, 255, 255, 0.68);

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .clip-extra {
            margin-top: 3px;

            font-size: 9px;
            line-height: 1.2;

            color: rgba(255, 255, 255, 0.45);

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .separator {
            padding: 0 5px;
            color: rgba(255, 255, 255, 0.3);
        }

        .audio-overlay {
            display: none;

            position: absolute;
            inset: 0;
            z-index: 100;

            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.45);

            font-size: 42px;
            font-weight: bold;

            cursor: pointer;
            user-select: none;
        }

        .audio-overlay.visible {
            display: flex;
        }

        .audio-overlay span {
            padding: 20px 32px;

            border-radius: 12px;
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

<body>

<div class="wrapper">
    <div class="video-container">
        <video
            class="video active"
            id="video-0"
            preload="auto"
            playsinline>
        </video>

        <video
            class="video"
            id="video-1"
            preload="auto"
            playsinline>
        </video>

        <div class="clip-info">
            <div class="clip-title-wrapper" id="clip-title-wrapper">
                <div class="clip-title" id="clip-title"></div>
            </div>

            <div class="clip-details">
                <span>Klippet av <span id="clip-creator"></span></span>
                <span class="separator">•</span>
                <span id="clip-date"></span>
            </div>

            <div class="clip-extra">
                <span id="clip-number"></span>
                <span id="clip-tags"></span>
            </div>
        </div>

        <div class="audio-overlay" id="audio-overlay">
            <span>Klikk for lyd 🔊</span>
        </div>
    </div>
</div>

<script type="application/javascript">
    function shuffle(array) {
        let currentIndex = array.length;

        while (currentIndex !== 0) {
            const randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;

            [array[currentIndex], array[randomIndex]] = [
                array[randomIndex],
                array[currentIndex]
            ];
        }
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const formatter = new Intl.DateTimeFormat("no-NO", {
            timeZone: "Europe/Oslo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
        });

        const clipTitle = document.getElementById("clip-title");
        const clipTitleWrapper = document.getElementById("clip-title-wrapper");
        const clipCreator = document.getElementById("clip-creator");
        const clipDate = document.getElementById("clip-date");
        const clipNumber = document.getElementById("clip-number");
        const clipTags = document.getElementById("clip-tags");
        const audioOverlay = document.getElementById("audio-overlay");

        const videos = [
            document.getElementById("video-0"),
            document.getElementById("video-1"),
        ];

        const queryParams = new URLSearchParams(window.location.search);

        const spesial = queryParams.get("spesial");

        let start = queryParams.get("start");
        if (start == null) {
            start = "2023-01-01T00:00:00Z";
        }

        if (spesial === "Romania") {
            start = "2025-05-29T00:00:00Z";
        }

        let end = queryParams.get("end");
        if (end == null) {
            end = "2026-12-31T23:59:59Z";
        }

        if (spesial === "Romania") {
            end = "2025-07-08T02:00:00Z";
        }

        let viewCountLimit = queryParams.get("viewCountLimit");
        if (viewCountLimit == null) {
            viewCountLimit = 0;
        }

        const response = await fetch(
            `https://api.j4d.dev/streamrig/clip?start=${start}&end=${end}&viewCountLimit=${viewCountLimit}&ignoreTags=karaoke,teknisk,nattero`
        );

        const clips = await response.json();

        if (clips.length === 0) {
            clipTitle.innerText = "Ingen klipp";
            return;
        }

        shuffle(clips);

        let clipIndex = 0;
        let activeVideoIndex = 0;
        let audioUnlocked = false;

        function showAudioOverlay() {
            audioOverlay.classList.add("visible");
        }

        function hideAudioOverlay() {
            audioOverlay.classList.remove("visible");
        }

        function updateTitleScrolling() {
            clipTitle.classList.remove("scrolling");
            clipTitle.style.removeProperty("--scroll-distance");
            clipTitle.style.removeProperty("--scroll-duration");

            requestAnimationFrame(() => {
                const overflow =
                    clipTitle.scrollWidth - clipTitleWrapper.clientWidth;

                if (overflow <= 0) {
                    return;
                }

                const scrollDistance = -overflow;
                const duration = Math.max(8, overflow / 35 + 5);

                clipTitle.style.setProperty(
                    "--scroll-distance",
                    `${scrollDistance}px`
                );

                clipTitle.style.setProperty(
                    "--scroll-duration",
                    `${duration}s`
                );

                clipTitle.classList.add("scrolling");
            });
        }

        function updateMetadata(index) {
            const clip = clips[index];

            clipTitle.innerText = clip.title;
            clipCreator.innerText = clip.creatorName;

            const date = new Date(clip.createdAt);

            clipDate.innerText =
                formatter
                    .format(date)
                    .replace(",", "");

            clipNumber.innerText =
                `${index + 1} / ${clips.length}`;

            clipTags.innerText =
                clip.tags?.length
                    ? ` • ${clip.tags.join(", ")}`
                    : "";

            updateTitleScrolling();
        }

        function prepareVideo(video, clip) {
            video.pause();
            video.src = clip.downloadUrl;
            video.preload = "auto";
            video.load();
        }

        function preloadNextClip() {
            if (clips.length <= 1) {
                return;
            }

            const nextClipIndex =
                (clipIndex + 1) % clips.length;

            const nextVideoIndex =
                (activeVideoIndex + 1) % videos.length;

            prepareVideo(
                videos[nextVideoIndex],
                clips[nextClipIndex]
            );
        }

        async function playCurrentClip() {
            const video = videos[activeVideoIndex];

            updateMetadata(clipIndex);

            video.classList.add("active");
            video.currentTime = 0;
            video.volume = 1;
            video.muted = false;

            try {
                await video.play();

                audioUnlocked = true;
                hideAudioOverlay();
            } catch (error) {
                if (
                    error.name === "NotAllowedError" &&
                    !audioUnlocked
                ) {
                    console.log(
                        "Autoplay med lyd ble blokkert. Starter video muted."
                    );

                    video.muted = true;

                    try {
                        await video.play();
                        showAudioOverlay();
                    } catch (mutedError) {
                        console.error(
                            "Kunne ikke spille av klipp, heller ikke muted",
                            clips[clipIndex],
                            mutedError
                        );
                    }
                } else {
                    console.error(
                        "Kunne ikke spille av klipp",
                        clips[clipIndex],
                        error
                    );
                }
            }

            preloadNextClip();
        }

        async function playNextClip() {
            const oldVideo = videos[activeVideoIndex];

            oldVideo.pause();
            oldVideo.classList.remove("active");

            clipIndex =
                (clipIndex + 1) % clips.length;

            activeVideoIndex =
                (activeVideoIndex + 1) % videos.length;

            await playCurrentClip();
        }

        audioOverlay.addEventListener("click", async () => {
            const video = videos[activeVideoIndex];

            try {
                video.muted = false;
                video.volume = 1;

                await video.play();

                audioUnlocked = true;
                hideAudioOverlay();
            } catch (error) {
                console.error(
                    "Kunne ikke aktivere lyd",
                    error
                );
            }
        });

        videos.forEach((video) => {
            video.addEventListener("ended", () => {
                if (video === videos[activeVideoIndex]) {
                    playNextClip();
                }
            });

            video.addEventListener("error", () => {
                if (video === videos[activeVideoIndex]) {
                    console.error(
                        "Feil ved avspilling av klipp",
                        clips[clipIndex],
                        video.error
                    );

                    playNextClip();
                }
            });
        });

        prepareVideo(
            videos[activeVideoIndex],
            clips[clipIndex]
        );

        await playCurrentClip();
    });
</script>

</body>
</html>
